repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.12.0
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: ''  # Use the sha / tag you want to point at
  hooks:
    - id: mypy
      additional_dependencies: ["types-authlib",
                                "types-frozendict",
                                "types-emoji",
                                "types-python-dateutil",
                                "types-redis"]
