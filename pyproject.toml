[project]
name = "fxtumblr"
version = "2.0.0"
description = "Tumblr embed wrapper"
readme = "README.md"
requires-python = ">=3.11"
package-mode = false
dependencies = [
	"aiofiles",
	"authlib",
	"httpx",
	"redis",
	"Quart",
	"frozendict",
	"emoji",
	"python-dateutil",
	"nh3",
	"markupsafe",
	"pydantic",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "ASYNC", "A", "B", "D", "F", "S", "I", "W"]
ignore = ["D212", "D203", "D205", "D202", "ASYNC109", "S101"]

[dependency-groups]
test = [
    "pytest",
	"pytest-asyncio",
	"pytest-dotenv",
    "pytest-httpserver",
    "pytest-cov",
    "fakeredis",
]
typing = [
    "mypy",
    "types-authlib",
    "types-frozendict",
    "types-emoji",
	"types-python-dateutil",
    "types-redis",
    "types-aiofiles",
]
render-playwright = [
	"playwright",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"

[tool.mypy]
exclude = ["tests"]
check_untyped_defs = true
